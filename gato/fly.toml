# Cambia "app" por un nombre único (fly launch lo puede hacer por ti).
app = "juego-gato"
primary_region = "qro"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Las partidas viven en memoria: una sola máquina siempre encendida.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
