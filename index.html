<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hello World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
  /* Single dark look: one centered word mark on pure black */
  :root {
    --bg: #000;
    --fg: #fff;
    --glow: rgba(255, 255, 255, 0.55);
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    display: grid;
    place-items: center;
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(3rem, 14vw, 12rem);
    line-height: 1;
    letter-spacing: -0.03em;
    text-align: center;
    color: var(--fg);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    column-gap: 0.28em;
  }
  .word { display: inline-flex; white-space: nowrap; }
  .ch {
    display: inline-block;
    animation:
      rise 1.1s cubic-bezier(.2, .9, .25, 1.15) both,
      wave 3.2s ease-in-out infinite;
    animation-delay: calc(var(--i) * 70ms), calc(1.4s + var(--i) * 110ms);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(0.6em) rotate(8deg) scale(.8); filter: blur(14px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes wave {
    0%, 60%, 100% { transform: translateY(0); text-shadow: 0 0 0 transparent; }
    30% { transform: translateY(-0.12em); text-shadow: 0 0 0.35em var(--glow); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ch { animation: none; }
  }
</style>
</head>
<body>
<h1 aria-label="Hello World">
  <span class="word" aria-hidden="true">
    <span class="ch" style="--i:0">H</span><span class="ch" style="--i:1">e</span><span class="ch" style="--i:2">l</span><span class="ch" style="--i:3">l</span><span class="ch" style="--i:4">o</span>
  </span>
  <span class="word" aria-hidden="true">
    <span class="ch" style="--i:5">W</span><span class="ch" style="--i:6">o</span><span class="ch" style="--i:7">r</span><span class="ch" style="--i:8">l</span><span class="ch" style="--i:9">d</span>
  </span>
</h1>
</body>
</html>
